name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The bundle is a generated file that is committed, so it can drift from the
  # Swirly revision the submodule pins. Rebuild it there and require the result
  # to be byte-identical.
  bundle:
    name: Bundle is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Swirly's lockfile is in the submodule rather than at the repository
      # root, so the cache has to be pointed at it. `cache: yarn` is not
      # optional either: setup-node v6 narrowed automatic caching to npm only.
      - uses: actions/setup-node@v7
        with:
          node-version: 18
          cache: yarn
          cache-dependency-path: vendor/swirly/yarn.lock

      # Nothing in this job launches a browser, so skip Puppeteer's ~150 MB
      # Chromium download during install.
      - name: Install Swirly's dependencies
        working-directory: vendor/swirly
        run: yarn --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      # Not `yarn build`: that runs turbo over every package, including
      # @swirly/examples, which rasterizes its PNGs by driving headless
      # Chromium and cannot launch it on a runner. Those images are no use to
      # the bundle -- it needs the library packages and nothing else.
      - name: Build Swirly
        working-directory: vendor/swirly
        run: yarn build --filter='!@swirly/examples'

      - name: Regenerate the bundle
        run: ./js/build.sh

      - name: Fail if it differs from the committed one
        run: |
          if ! git diff --quiet -- src/swirly-bundle.js; then
            echo "::error::src/swirly-bundle.js is out of date." \
                 "Run ./js/build.sh and commit the result."
            git diff --stat -- src/swirly-bundle.js
            exit 1
          fi
          echo "Bundle matches vendor/swirly @ $(git -C vendor/swirly rev-parse --short HEAD)"
