name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The bundle is a generated file that is committed, so it can drift from the
  # Swirly revision it claims to come from. Rebuild it at that revision and
  # require the result to be byte-identical.
  bundle:
    name: Bundle is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned Swirly revision
        id: rev
        run: echo "sha=$(cat js/swirly-rev.txt)" >> "$GITHUB_OUTPUT"

      - name: Check out Swirly at that revision
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SWIRLY_REPO || 'timdp/swirly' }}
          ref: ${{ steps.rev.outputs.sha }}
          path: swirly

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build Swirly
        working-directory: swirly
        run: yarn --frozen-lockfile && yarn build

      - name: Regenerate the bundle
        run: SWIRLY="$GITHUB_WORKSPACE/swirly" ./js/build.sh

      - name: Fail if it differs from the committed one
        run: |
          if ! git diff --quiet -- src/swirly-bundle.js; then
            echo "::error::src/swirly-bundle.js is out of date." \
                 "Run ./js/build.sh and commit the result."
            git diff --stat -- src/swirly-bundle.js
            exit 1
          fi
          echo "Bundle matches Swirly @ ${{ steps.rev.outputs.sha }}"
